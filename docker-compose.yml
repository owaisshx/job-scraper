version: '3.8'

services:
  # MongoDB database
  mongodb:
    image: mongo:7
    container_name: job-scraper-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: job-scraper

  # Redis for BullMQ
  redis:
    image: redis:7-alpine
    container_name: job-scraper-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # NestJS App
  app:
    build: .
    container_name: job-scraper-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    depends_on:
      - mongodb
      - redis
    environment:
      MONGODB_URI: mongodb://mongodb:27017/job-scraper
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SEARCH_QUERIES: Node.js developer,NestJS developer,TypeScript developer
      SEARCH_LOCATION: Pakistan
    volumes:
      - ./sessions:/app/sessions  # persist sessions across restarts

volumes:
  mongo_data:
  redis_data:
